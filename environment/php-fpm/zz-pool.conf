; Overrides the default pool settings of the php:fpm image (loaded after www.conf / zz-docker.conf).
; The default max_children = 5 caps concurrent PHP requests across ALL players.
[www]
pm = dynamic
pm.max_children = 30
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500
